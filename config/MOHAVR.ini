; MOHAVR -- shipped defaults. Deployed next to dinput8.dll in UnrealEngine3\Binaries.
; Every behaviour has a switch; on by default only once the simulator has proven it.

[General]
; 0 = act as a plain dinput8.dll proxy and do nothing else
Enabled=1

[Hooks]
; Observe Direct3DCreate9 through the game's import table (M1)
Direct3DCreate9=1

[Bridge]
; 1 = create the game's IDirect3D9 through Direct3DCreate9On12, so every D3D9 resource is a
; D3D12 resource (the zero-copy path to OpenXR, D5a). Headset-proven (rounds 1-4).
D3D9On12=1
; 1 = start MOHAVR-host.exe (64-bit, next to this file) and hand it each frame through shared
; D3D12 textures; the host runs OpenXR outside the game's 2 GB address space (D10).
; Needs D3D9On12=1. Uses OpenXR.RuntimeJson below.
Host=1
; Desktop mirror -- the game's own window stays white under D3D9On12, so the host can show what the
; headset gets (the centre of the left eye) on the monitor: 0 = off, 1 = over the game window
; (click-through, only while the game is in front), 2 = in its own "MOHAVR mirror" window.
Mirror=1
; Frame pacing -- the default for the in-headset menu's "Frame pacing" (your choice there is kept and wins):
; 1 = the game draws one frame per headset frame, starting each just after the headset's poses arrive, so the world
; steps evenly from frame to frame (round 25 in the headset: the world shown 11 ms behind each frame, spread 0.5 ms;
; uncapped 14-21 ms, spread 1.3-3.2 ms, and most frames drawn for nothing); 0 = the game runs uncapped.
Pace=1

[Camera]
; 1 = the headset drives the game camera (M3): view = game heading + head orientation; the game's
; own pitch/roll are replaced by the head's. Needs Bridge.Host=1. Headset-proven (rounds 2-4).
HeadTracking=1
; 1 = also apply head translation (lean, crouch in place)
HeadPosition=1
; 1 = render with the headset's field of view (asymmetric projection)
HeadsetProjection=1
; 1 = stereo (M4): the engine draws two views side by side -- left half = left eye, right half =
; right eye -- through its own split-screen path, each with that eye's pose and FOV. Headset-proven (rounds 3-4).
Stereo=1
; 1 = give the right eye its own occlusion/visibility history (FSceneViewState). With one shared
; state the right eye used the left eye's occlusion results and flickered (headset round 3).
StereoViewState=1
; Unreal units per metre -- sets head movement AND, in stereo, the eye separation, i.e. the perceived
; world size (higher = smaller world). 100 per the player in the headset (round 4), which matches the
; 192-unit soldier (ENGINE-NOTES 5i). The in-headset menu overrides this per player (MOHAVR.user.ini).
UnitsPerMeter=100
; While head tracking: turn the game's motion blur / depth of field off in memory (head motion is
; camera motion, so they smear the image). Your MOHA settings file is not changed.
DisableMotionBlur=1
DisableDepthOfField=1
; 1 = a jump lifts the view the way the game lifts its camera (up to 8 cm); 0 = left out (round 26: it bumped the view
; on every jump, and the gun in your hand dropped as far).
JumpLift=0
; The view is kept at least this many cm above your feet (0 = off). The parachute's botched landing rolls the game's
; camera down to 18 cm above the floor, and in VR you look out level from there -- into the ground (GOAL B, D26). 60 is
; below a crouch (96 cm) and standing (161 cm), so only the roll (or a death / knock-down camera) is held.
MinEyeHeight=60
; 1 = through the parachute landing (the roll, getting up, taking the gear off) the view stays at your standing eye and
; your heading, instead of following the game's camera animation down to the floor and round about; your head still
; turns and moves the view. 0 = the game's landing camera (held above the floor by MinEyeHeight).
SteadyLanding=1
; Flat screen (M5): instead of splitting across the eyes, draw these full-screen and flat, without head
; tracking, on a world-locked screen in front of you:
;   0 = never, 1 = UI menus (main menu, pause, ...: detected by the Windows cursor being shown),
;   2 = UI menus + cinematic cameras (the view isn't the player's own: cutscenes, and also the game's
;       own camera animations such as the parachute landing roll).
; The screen: ScreenDistance / ScreenWidth in metres (also used whenever there's no view).
CinemaScreen=1
ScreenDistance=2.0
ScreenWidth=1.6

[Render]
; The game's resolution while the mod runs (windowed; 0 = the game's own setting). Each eye gets half the
; width: 2880x1620 -> 1440x1620 per eye (sharper; headset round 5), 1920x1080 -> 960x1080. 2880x1620
; measured 6.0 ms per frame with ~500 MB of address space left (ENGINE-NOTES 5p). Lower it on a slower PC.
; Your MOHA settings and Steam launch options are not changed.
ResX=2880
ResY=1620
; 1 = keep the game window at the size it renders. Otherwise Windows shrinks a window bigger than the desktop
; when you drag it, and the two eye images get mixed up (double vision; headset rounds 5-6). Moving is fine.
LockWindow=1
; 1 = decals (bullet holes, scorch marks) show in the right eye too. The engine culls every decal in a view
; that doesn't start at x = 0 (headset round 7; ENGINE-NOTES 5r).
DecalFix=1

[HUD]
; 0 = the HUD as the game draws it: in stereo, once per eye half, laid out for a half-width screen (it
;     lands in different places in each eye)
; 1 = one head-locked panel: Width metres wide, Distance metres ahead, Down metres below eye level; both
;     eyes see it in the same place (M5)
; Scale = the HUD's own size inside the panel (1 = its designed pixel size; smaller fits more in).
Mode=1
Distance=2.0
Width=2.4
Down=0.1
Scale=0.5
; 0 = hide the game's own crosshair (with a controller aim it isn't where the shot goes; the red dot is -- round 20);
; 1 = keep it.
Crosshair=0
; 0 = hide the red cross the game shows for a moment when a shot hits someone (round 22); 1 = keep it.
HitMarker=0

[Aim]
; 1 = your head's up/down angle is the player's aim pitch: the gun and the shots follow where you look
; vertically (left alone, stray mouse movement tilts the gun in front of your eyes).
HeadPitch=1
; What you aim with (needs Input.Controllers for 2/3):
;   0 = the game's own aim: the body's heading, and the head's pitch (HeadPitch)
;   1 = the head: shots land where you look (the centre of your view)
;   2 = the left controller, 3 = the right controller: shots land where it points
; The aim bends the game's shots (from its eye) to where the head/controller ray hits. (Default 3: the player's
; choice, headset round 11.)
Mode=3
; Modes 2/3: 1 = the shot itself starts at the gun and runs along the red dot's ray (the same ray, start and collision
; as the dot, so they can't disagree -- round 22), unless something stands between your eyes and the gun; 0 = from
; the game's eye towards the dot's point.
ShotFromGun=1
; With ShotFromGun: 1 = a launcher's rocket (the Panzerschreck, the M18) starts on the aim line, where the red dot's ray
; starts, and flies along it; 0 = from the game's own barrel position, beside your head, towards the dot's point.
LauncherFromGun=1
; 1 = log where each shot went against the red dot (the first 400 shots; MOHAVR.log "shot N:").
ShotLog=1
; The game's shot spread (hip fire is wide, and it grows while you turn -- your head always moves in VR), scaled:
; 0 = none (your hand is the spread), 1 = the game's.
Spread=0
; Modes 2/3 with the gun in your hand (Weapon.ViewModel=2): cm the aim runs above the controller, along the gun's
; barrel (8: headset round 12, the pistol).
RayUp=8
; Modes 2/3: a red dot where the shot will land (ReticleSize in degrees). Reticle is the default; the menu's Red dot
; turns it on or off (saved as the player's own).
Reticle=1
ReticleSize=0.8

[Weapon]
; Once landed (the parachute's roll and taking the gear off): 0 = the parachuting body (legs, torso, gear) hidden, as it
; is in play -- only the arms, 1 = the game's (the body shown through the landing).
LandingBody=0
; 1 = hide the first-person gun (it sits a few cm from the eyes, so in stereo it's seen double). Uses the
; pawn's own HideWeapon command; survives weapon switches. The hands/arms stay.
HideViewModel=0
; 1 = also hide the first-person body/sleeves (the pawn's RenderBody command).
HideBody=0
; The first-person arms and gun:
;   0 = as the game draws them (a flat-screen trick: in the headset they look doubled)
;   1 = true 3D, where they really are (in front of your face)
;   2 = in your aiming hand (the controller Aim.Mode uses; the right one by default). Default: headset round 12.
ViewModel=2
; 1 = the arms reach from your body to the gun in your hand (arm IK) instead of moving with it as one piece.
; (Headset round 16 passed.)
ArmIK=1
; With ArmIK: 1 = your other hand leaves the gun unless it holds the foregrip, and follows your other controller.
FreeOffHand=1
; Where your shoulders are for the arm IK: cm apart, below your eyes, and behind them (width 36 -> 30, round 19:
; "bring shoulders in a bit").
ShoulderWidth=30
ShoulderDrop=22
ShoulderBack=6
; How the elbow bends (round 20: the free arm's elbow looked twisted when each segment took its own shortest turn):
; 2 = the forearm is carried by the upper arm and bent from there; 1 = both turn about the elbow's hinge (the shoulder
; pinches); 0 = the old way.
ElbowHinge=2
; 1 = with a pistol or a grenade the free arm starts from the long gun's arm pose (round 20: the pistol's own left arm,
; far from where your hand is, twisted and jittered); 0 = from the weapon's own.
FreeArmPose=1
; The guns the free hand's hold is taken from (its grip on your other controller, and the arm pose it starts from); once
; one of them has been held, every weapon's free hand uses that hold. Empty = the last long gun held (before round 35:
; the BAR's turned the wrist and opened the hand, the SMGs' made a fist). Round 35: the rifles, whose grips agree.
FreeHandFrom=Attachment_G43 Attachment_M1Garand Attachment_K98 Attachment_Springfield Attachment_M12CombatShotgun
; 1 = that hold is kept between sessions (in %LOCALAPPDATA%\MOHAVR\MOHAVR.freehand.bin), so a session begun with the
; BAR starts with it too; 0 = taken anew each session.
FreeHandSave=1
; 1 = the menu's Weapons tab has "Give all weapons" (the game's own cheats: EnableCheats, GiveWeapon for each class in
; GiveAllList, GiveAmmo). The guns join the inventory at your profile's upgrade levels; switch to them with next weapon.
; A class the level doesn't hold (the launchers outside their missions) gives nothing.
GiveAllMenu=1
GiveAllList=MOHAThompson,MOHA_MP40,MOHAStg44,MOHABar,MOHAG43,MOHAColt45,MOHAMauser,MOHAM1Garand,MOHAK98,MOHASpringfield,MOHAM12CombatShotgun,MOHAPanzerschreck,MOHAM18RecoillessRifle
; 1 = with the gun in your left hand, the arms and the gun are drawn mirrored (a left-handed rig: the left arm holds the
; gun, the game's animations become left-handed; round 25); 0 = the right arm reaches across to the gun in your left hand.
LeftHandMirror=1
; What your first-person arms play while you sprint: idle (they hold the gun as when standing; the sprint's view
; shake goes too), walk, or game (the game's sprint animation, which swings the gun out of your hand -- rounds 22-23).
; Sprinting itself (speed, zoom, sound) is the same with any of them, and this works with any ViewModel.
SprintArms=idle
; What your first-person arms play while you walk: idle (the view and the gun in your hand stop swaying with your steps --
; round 25) or game (the game's walk and run animations). Walking itself (speed, footsteps) is the same.
WalkArms=idle
; ... and while you jump, fall and land: idle (round 26: stepping off a ledge or over rough ground played the jump and
; landing animations, which swung the view and the gun) or game.
JumpArms=idle
; 1 = the gun, the arms and the free hand are moved along with your body's move since the view they were placed from
; (round 25: while moving they trailed the view by one frame -- a few cm, more with the gun held to the side).
CatchUp=1
; 1 = the player's tracers show. They start at the barrel of the gun where the game itself holds it (in front of your
; face), not at the gun in your hand, so they're off by default (round 22).
Tracers=0
; Your muzzle flash: barrel = at the muzzle of the gun in your hand (round 27), hide = none, game = where the game puts
; it (in front of your face: it places it where it holds the gun itself, round 25).
MuzzleFlash=barrel
; Your ejected brass: gun = out of the gun in your hand (round 26; the game throws it from in front of your face),
; hide = none, game = where the game puts it.
Brass=gun
; 1 = with the gun in your left hand, the brass flies out of the mirrored gun's side, mirrored (round 28; round 27: it
; flew the right-hand way, across the gun).
BrassMirror=1
; 1 = reload by hand (D21; RELOAD-DESIGN.md): drop the magazine (the gun hand's B / Y, or pull it out), take a new one
; from the belt pouch, insert it, rack when empty. Guns without a line in the ManualReload section keep the reload gesture.
; The player's own once toggled in the menu (Manual reload). Proven in the simulator (M0-M6, 2026-09-30).
ManualReload=1
; 1 = a grenade in the gun hand works as the off hand's (round 43): its trigger pulls the pin, a second pull cooks, squeeze
; the grip, swing and let go to throw; 0 = the game's own (hold the trigger, let go to throw). The player's own once toggled
; in the menu (Weapons: Hand grenades).
GrenadePin=1
; ViewModel=2: the point of the gun, in the game camera's frame (Unreal units: forward, right, up), that is
; put on the controller. Default: the gun's origin (measured 2026-09-27: 34 forward, 11 right, 17 down).
GripX=34
GripY=11
GripZ=-17

[Input]
; 1 = the headset's controllers play the game as an Xbox pad (M6): the host maps them to a virtual
; pad 0 and the mod answers the game's XInput polls with it. Needs Bridge.Host=1. A real pad in
; slot 0 is hidden while the host drives it. With this on, TAP the left menu button for the game's
; Start (pause) and HOLD it for the MOHAVR menu.
Controllers=1

[Controls]
; Which way the move stick's forward goes: head = where you look (round 29), body = the game's own (your body's heading,
; which the right stick turns). The in-headset menu's "Move direction" switches it (your choice is then kept).
MoveDirection=head
; Which controller input(s) drive each Xbox control (Controllers=1); several are joined with commas.
; Inputs: a b x y lgrip rgrip ltrigger rtrigger lthumb rthumb menu rflickdown rflickup none
; (lthumb/rthumb = stick clicks, menu = a tap of the left menu button, rflickdown/rflickup = flicking
; the right stick down/up). What the game does with each Xbox control (MOHA's own pad layout):
;   A reload/use/flare/skip   B switch weapon   X crouch (toggles)   Y jump   LB alt fire
;   RB grenade   LT aim   RT fire   LS sprint   RS melee   Start pause   Back scores
; Defaults (headset round 5): A jump, B reload, right grip interact, Y switch weapon, X grenade,
; left stick click sprint; round 50 (the player: "Remap crouch to right stick click"): the right stick click crouches, the
; right stick flicked down is the game's melee (a swing of the gun is physical melee). LB (alt fire: a weapon attachment on/off) is unmapped
; (round 24: the left grip is for the foregrip and the holsters). LT (the game's aim / zoom) is unmapped too (round 32,
; the player: the left trigger flips twin magazines and arms the MP40's magazine grab; in VR you aim down the sights).
A=b,rgrip
B=y
X=rthumb
Y=a
LB=none
RB=x
LT=none
RT=rtrigger
LS=lthumb
RS=rflickdown
Start=menu
Back=none
DPadUp=none
DPadDown=none
DPadLeft=none
DPadRight=none
; 1 = sprint is a toggle: click the stick to start sprinting, click again (or stop moving) to stop.
; 0 = hold the click to sprint (the game's own behaviour).
SprintToggle=1
; Which thumbstick is the Xbox left / right stick: left, right or none.
LeftStick=left
RightStick=right
; 1 = the right stick's up/down also pitches the game camera (off: the head drives pitch, and the
; right stick's down flick is the game's melee).
RightStickY=0
; How long to hold the left menu button to open the MOHAVR menu (seconds).
MenuHoldSeconds=0.6
; Defaults for the player's menu choices (the menu saves theirs): 1 = the right stick moves and the left turns
; (the stick's click and flick go with the turning stick); the gun hand at start (left / right; drawing from a holster
; changes it -- the hand that draws holds the gun, and its trigger fires).
SwapSticks=0
GunHand=right

[Hands]
; Foregrip, reload gesture and holsters passed headset round 14; throwing round 15 (ThrowScale raised to 2.2: at 1.5 a
; 7-9 m/s throw gave ~1200 units/s against the game's own ~1900).
; 1 = the other hand's grip at the gun's foregrip holds it with two hands: the gun points from the gun hand through
; the other hand. Where the foregrip is (cm ahead of / above the gun hand) is per gun in the menu's Gun fit; these
; are the defaults.
Foregrip=1
ForeFwd=30
ForeUp=0
; 1 = the old reload gesture: the other hand's grip at a fixed spot under the gun sends the game's own reload (with its
; ring). 0 (round 33, the player): gone -- the manual reload does it; guns without one reload with the game's own (B).
ReloadGesture=0
; 1 = a hand holding a gun grips the ammo pouch (Holsters MagPouchSpot, the middle of the belt): the gun -- or the
; pistol in the off hand -- is reloaded at once, no animation (the player, 2026-10-02). The player's own once toggled in
; the menu (Weapons: Pouch reload).
PouchReload=1
; Where on each controller the hand interacts -- the white dot (cm from the controller's aim point: forward, up, in toward
; the palm; mirrored for the left hand), the foregrip ring's radius (cm), and the reload rings' size (%, the magazine's
; and the action's grab rings and the reload gesture's). The player's own from the menu's Holsters page.
HandPoint=-6 -4 3
ForegripRadius=12
ReloadRingScale=100
; 1 = a grenade flies with your gun hand's velocity when you let go of the trigger (a slow release, under 1 m/s,
; keeps the game's own throw); ThrowScale multiplies the hand's speed.
Throw=1
ThrowScale=2.2
; 1 = a controller that loses tracking (the Quest drops idle controllers after ~10 s without moving) stays where it was
; relative to your head (not its tilt) until it's tracked again, instead of the gun jumping to the game's own place in
; front of your eyes (round 24).
HoldLost=1
; Rings around the gesture spots (the holsters, and the off hand's foregrip and magazine spots) and a dot on the
; off hand: never, near (when a hand comes close) or always. The player's choice is saved from the menu.
Rings=near
; The free support hand (off the foregrip; Weapon.FreeOffHand): it keeps its long-gun hold, mirrored onto its own
; controller, whatever is in the gun hand. Tilt, turn, roll (degrees) and forward (cm) on top of that; the menu's
; Free hand page adjusts it and saves the player's own. Round 19: the plain mirror had the fingers pointing back; the
; player's fix, tilt 180, is the default.
FreeHand=180 0 0 0

[Holsters]
; Reach to a spot and squeeze the grip to draw -- either hand; the hand that draws holds the gun. Each spot runs one of
; the game's commands (SwitchPrimary, SwitchSecondary, SwitchPistol, SwitchGrenade, SwitchFragGrenade, SwitchGammon,
; SwitchStick, Reload) or none.
Enabled=1
RightShoulder=SwitchPrimary
LeftShoulder=SwitchSecondary
RightHip=SwitchPistol
LeftHip=SwitchGrenade
; The chest (the player, 2026-10-02: "Add chest holster"): a cross-draw for the off-hand pistol. What each holster holds is
; the player's to choose in the menu (Holsters: Holds), saved in their own settings.
Chest=SwitchPistol
; Where each spot is: cm from the head, in its heading -- right, up, forward (negative = behind) -- and its radius.
; The player moves and sizes them in the menu (Holsters), saved in their own settings.
RightShoulderSpot=20 -22 -8 16
LeftShoulderSpot=-20 -22 -8 16
RightHipSpot=22 -65 0 16
LeftHipSpot=-22 -65 0 16
ChestSpot=0 -34 10 12
; The manual reload's magazine pouch (Weapon ManualReload): at the middle of the belt; the grip there takes a new magazine
; while the gun's is out.
MagPouchSpot=0 -60 14 12

[OffHand]
; The off-hand grenade (OFFHAND-DESIGN.md; the player: "being able to grab a grenade with the off hand and throw it without
; unequipping your gun would be very immersive"). 1 = with a gun in hand, the free hand's grip at the grenade holster
; (Holsters LeftHip=SwitchGrenade, or SwitchFragGrenade / SwitchGammon / SwitchStick) takes a grenade into that hand:
; its trigger pulls the pin, a second squeeze lets the spoon go (the fuse burns), letting go of the grip throws it with the
; hand's speed; let go with the pin in, it goes back. 0 = the holster draws the game's grenade as before. The player's
; choice is saved from the menu (Weapons).
Grenade=1
; grip = held while the grip is held, let go to throw (or to put it back with the pin in); click = a click at the holster
; takes it and it stays, squeeze and let go to throw once the pin is out, a click at a holster puts it back with the pin
; in. The player's choice is saved from the menu (Weapons: Grenade hold).
GrenadeHold=click
; trigger = the off hand's trigger pulls the pin; auto = the take pulls it.
Pin=trigger
; Cooking: spoon = a second trigger squeeze lets the spoon go and the fuse burns in the hand; pin = the fuse starts at the
; pin; off = it starts at the throw. Held too long, it goes off in the hand.
Cook=spoon
; The hand's release speed times this (the gun hand's Hands.ThrowScale, for the off hand).
ThrowScale=2.2
; A release slower than this (m/s): toss = the game's own gentle throw along the view; drop = it falls with the hand's speed.
MinThrowSpeed=1.0
SlowRelease=toss
; The hand's speed is capped here (m/s): a controller's tracking glitch can't fling a grenade across the map.
MaxHandSpeed=12
; 1 = a thrown grenade passes through the thrower's own body (it leaves the hand inside the collision cylinder).
PassThrower=1
; 1 = the HUD's grenade count shows the type in the off hand.
HudType=1
; 1 = the grenade is drawn in the off hand while held.
Carrier=1
; 1 = pulses in the controller: the take, the pin, the spoon, the fuse ticking, the throw (and the off-hand pistol's draw,
; shots, dry clicks and refills).
Haptics=1
; The off-hand pistol (OFFPISTOL-DESIGN.md; the player: "Is it possible to build similar system for using the pistol with
; the off hand?"). 1 = with a gun in hand, the free hand's grip at the pistol holster (Holsters RightHip=SwitchPistol)
; draws the pistol into that hand and its trigger fires it, one round per pull; the gun stays in the gun hand. While it is
; out the long gun is one-handed: no foregrip, no off-hand grenade, no manual reload until it is put back. 0 = the holster
; draws the game's pistol as before. The player's choice is saved from the menu (Weapons).
Pistol=1
; toggle = a squeeze at the pistol holster draws it and a squeeze at any holster puts it back; grip = held while the grip is.
PistolHold=toggle
; Back in the holster: game = refilled after the pistol's own reload time (the Colt 1.5 s); instant = at once; off = never.
PistolRefill=game
; 1 = its own red dot (shown with the menu's Red dot).
PistolDot=1
; pistol = its hits, kills and experience count for the pistol; main = for the gun in hand.
PistolCredit=pistol
; 1 = the save's upgrades applied to the pistol when it is drawn, if it hasn't had them yet.
PistolUpgrades=1
; 1 = the game's switch weapon never takes the pistol out of the off hand (it changes to the primary instead).
PistolKeep=1
; Two pistols (the player, 2026-10-02): 1 = with the pistol in the gun hand, the off hand at a pistol holster draws its
; twin -- the same pistol, its own clip, refilled in the holster too.
PistolPair=1
; The off-hand pistol's slide (the C96's bolt) back on each shot and held back when empty, and its own muzzle flash
; (round 45; both proven in the simulator).
PistolSlide=1
PistolFlash=1
; Its brass out of its ejection port on each shot (the pistol's own casings), and its kick: the game's own pistol fire
; animation's move of the gun, as the gun hand's pistol kicks (0 none .. 1 the game's; the hand moves with it) (round 46;
; both proven in the simulator).
PistolBrass=1
PistolKick=1

[Melee]
; Physical melee (MELEE-DESIGN; the player, 2026-10-03: "Can the motion of hitting with the butt of the gun do the melee
; damage?"): swing the drawn gun's butt into an enemy (a pistol's grip; the C96's shoulder stock; the M12's bayonet at
; level 2, thrust or slash) and it does the game's own melee -- its damage (50; a head hit kills; the bayonet 200), its
; credit and its impact effects -- with no button and no animation. The right stick's melee stays as it is (the launchers
; have only that). The menu's Weapons tab "Physical melee" is the player's switch (this is the default until toggled;
; proven in the simulator).
Physical=1
; The swing, measured on the controllers against your head (walking, turning in the room or with the stick never count),
; m/s: a butt or grip stroke needs the gun hand (or the front hand on the foregrip) at HandSpeed and the butt at ButtSpeed.
HandSpeed=1.5
ButtSpeed=3.0
; A bayonet: a thrust drives the hand along the barrel at ThrustSpeed (within ThrustCos of it, ThrustTravel m forward in
; 0.25 s, the gun turning under MaxTurn rad/s: a re-aim turns); a slash moves the tip at SlashSpeed across the blade (the
; motion's |cos| to the blade at most SlashCos) with the hand at BladeHandSpeed.
ThrustSpeed=2.5
ThrustCos=0.8
ThrustTravel=0.15
MaxTurn=3.0
SlashSpeed=8.0
SlashCos=0.6
BladeHandSpeed=2.5
; A strike travels at least Travel m in 0.25 s (no waggling), stays armed Hold s after its speed (players brake before an
; impact they can't feel), and the same soldier waits TargetCooldown s (the weapon's own re-melee interval between hits).
Travel=0.12
Hold=0.12
TargetCooldown=0.5
; 1 = the front of the gun strikes too (a muzzle jab or a barrel swing, with the bayonet's gates).
Muzzle=0
; 1 = props and the world show the game's melee impact effects; the game's damage goes only to the props meant for melee
; (the Flakturm's vent covers, physics props) -- Props=1: to every prop struck (fuel barrels, radios, controls...).
World=1
Props=0
; 1 = no strike where the eye can't see the gun hand or the hand the contact (through a wall).
LineOfSight=1
; 1 = the game's own rule: struck while sprinting, the soldier dies.
ChargeKill=1

[Scope]
; Scopes you raise to your eye (SCOPE-DESIGN.md): with the scope at the eye (and two hands on the gun) the eye looks
; through it -- a third view rendered down the scope, shown in the eyepiece to that eye only. 0 = off. The menu's Scopes is
; the player's.
Enable=1
; Pixels at the right of the game's image for the scope view (a square), taken from the eyes' width only while a scope is
; at an eye. 0 = no scope view at all.
Column=512
; real = each scope's real magnification (the Springfield's M73B1 2.5x; the ZF4 on the G43 and the StG44 4x); game = the
; game's zoom (from its widest; the turning stick up / down zooms while looking through). The menu's Scope zoom is the player's.
Zoom=real
; 1 = the scope only with both hands on the gun (the off hand on the foregrip), as a marksman holds it.
TwoHands=1
; The eye counts as at the scope within EyeDistance cm behind the eyepiece and EyeOffAxis cm of its axis.
EyeDistance=12
EyeOffAxis=2.5
; The eyepiece's apparent field (degrees across): the magnified picture fills it, with the field stop's black ring.
Field=22
; The exit pupil: EyeRelief cm behind the eyepiece, Pupil cm across its forgiving half -- off it the picture darkens.
EyeRelief=7
Pupil=1.2
; The game zoom's speed: degrees of its FOV a second at full stick.
ZoomRate=20
; The scope's zero (metres): the reticle meets the shots' line this far out; nearer they land a little low (the scope
; sits above the barrel), as with a real scope.
Zero=50

[ControlsMenu]
; While one of the game's menus is open (title screen, pause, ...) the face buttons work as labelled, so A
; selects and B backs out. Everything not listed here works as in [Controls].
A=a
B=b
X=x
Y=y

[Comfort]
; Turning with the right stick (Input.Controllers=1): 0 = smooth, 30 or 45 = snap by that many
; degrees per flick. The in-headset menu (Turning) overrides this per player.
SnapTurn=0

[OpenXR]
; 1 = start an OpenXR session INSIDE the game (diagnostic; costs ~258 MB of the game's address
; space, ENGINE-NOTES 5e). Ignored when Bridge.Host=1.
Enabled=0
; Empty = the machine's active OpenXR runtime (the headset). A path to a runtime .json sets
; XR_RUNTIME_JSON for the process that runs OpenXR only. It must match THAT process's bitness:
;   Bridge.Host=1 (64-bit host):   C:\Users\j_tom\Projects\MOHAVR\tools\OpenXR-Simulator\bin\openxr_simulator.json
;   OpenXR.Enabled=1 (in-game x86): C:\Users\j_tom\Projects\MOHAVR\tools\OpenXR-Simulator-x86\bin\openxr_simulator.json
RuntimeJson=

[Debug]
; 1 = pretend the build check failed, to prove the mod stands down cleanly
TestWrongBuild=0
; 1 = write the game camera (position, yaw, pitch) to %TEMP%\MOHAVR\view_state.txt 5x a second (tests)
ViewState=0
; 1 = log, per frame from leaving the ground until 8 s after landing, how high the eye and the game camera are above
; the floor under the eye (eyefloor: lines, and a summary per landing; tests)
EyeFloor=0
; 1 = run console commands from %TEMP%\MOHAVR\game_cmd.txt (tools/game_cmd.py; tests only)
GameCommands=0
; 1 = log the class/property layout of the player's pawn once (engine research).
Reflect=0
; N > 0 = pause the world (FreezeFrame; needs EnableCheats first) N frames after the first muzzle flash, logging the flash
; each frame until then and where it and the left eye are: its flame shows for about one frame, too short for a capture
; otherwise (tests only).
MuzzleFreeze=0
; 1 = if the game crashes inside d3d9 / d3d9on12 / ucrtbase, write %TEMP%\MOHAVR\crash-<pid>.dmp with the memory the
; stack points at, and log a stack scan (round 29: the pause-menu crash). The crash itself is unchanged.
CrashDump=1
; 1 = test the above: a caught access violation at the first frame (tests only).
CrashDumpTest=0
; 1 = the manual reload's M0 probe: log the drawn guns' bones, the weapon's ammo and reserve, and the calls of the
; game's reserve-ammo test (a hook that only counts) -- research, no behaviour change.
ReloadProbe=0
; 1 = the manual reload: log the weapon's state changes (tests).
ReloadTrace=0
; The dropped magazine's fall and the twin pair's flip this many times slower (for captures).
ReloadSlowMo=1
; 1 = the off-hand grenade: log its availability, the hold's states and the fuse's ticks (tests; where each thrown grenade
; goes is logged anyway).
OffHandTrace=0
; 1 = physical melee: log each armed swing (its speeds, travel), contacts and refusals (tests; the hits are logged anyway).
MeleeTrace=0
; 1 = the scope spike: the scope view always rendered, from the right eye, ScopeViewFov degrees wide (tests only).
ScopeView=0
ScopeViewFov=10
; 1 = draw the right eye first (experiments only)
SwapEyeOrder=0
; 1 = draw the left eye in the right half (experiments only)
SwapHalves=0
; 1 = log scissor rectangles and viewport changes with a stack scan (diagnostics; found the decal bug)
TraceScissor=0

[ManualReload]
; 1 = the game can't reload a converted gun by itself while the manual reload is engaged (a hook on its reserve-ammo
; test; RELOAD-DESIGN 2.5). Proven in the simulator (M1, 2026-09-30).
Hook=1
; 1 = a closed bolt keeps its chambered round when a magazine with rounds is dropped (the player's choice, D21).
KeepChambered=1
; The gun hand's button that drops the magazine: upper = B (right hand) / Y (left hand), lower = A / X, none. It is kept
; from the game while the manual reload drives the gun.
ReleaseButton=upper
; cm the off hand pulls a grabbed magazine out before it comes away; within InsertRadius cm of the magazine well, and
; its way out within InsertAngle degrees of the well's, a held magazine goes in.
PullOut=4
InsertRadius=5
InsertAngle=40
; Where a magazine from the pouch sits in the off hand (cm from its aim point: right, up, back; for the left hand -- the
; right hand holds it mirrored).
Hold=0 0 0
; The action (bolt, handle, slide): the off hand's grip within BoltGrabR cm takes it. One that is forward is pulled back
; past RackArm of its travel (at least RackMin cm) and let go (or brought forward); one held back (locked open, or a
; handle held back as the empty cue) is tugged RackTug cm and let go.
BoltGrabR=5
RackArm=0.85
RackMin=4
RackTug=1
; GOAL A3, a pump gun (the M12): the off hand on the foregrip IS the pump -- drawn back along the gun past PumpArm of the
; pump's travel it has gone back (the case out); forward again (or let go) it closes on a shell.
PumpArm=0.85
; 1 = the foregrip of a pump gun is just a foregrip until you squeeze that hand's trigger: then it is the pump (let go of
; the trigger and the pump closes). 0 = the foregrip always pumps.
PumpTrigger=1
; 1 = on a gun whose magazine needs the off hand's trigger (GrabTrigger: the MP40), holding the foregrip and squeezing that
; hand's trigger takes the magazine out of the well.
ForeGrabTrigger=1
; 1 = the magazine-out, magazine-in and rack sounds of each gun's own reload (the arms' reload cues), and SndTake when a
; magazine comes from the pouch.
Sounds=1
SndTake=foley.WpnMvmt_Generic_Cloth_Mono
; 1 = a dropped magazine falls to your feet and is gone a moment later (round 31); 0 = it vanishes.
DropFall=1
; 1 = the drawn hand takes the game's own reload grip (from its reload animations) on the magazine you grab, the one you
; hold, and the handle or bolt you rack, and a held magazine sits in the hand that way (round 31). 0 = the hand stays
; as your controller has it.
Grips=1
; Per gun (the attachment class): Action=open|closed, MinUpgrade, the magazine bones (variants ;-separated), the way the
; magazine leaves the well, its grab point, the action bone(s) and their idle / empty / full-back Z, the handle's grab
; point, the visible top round (mesh space, units; RELOAD-DESIGN 1.1-1.3), and the magazine-out / -in / rack sounds (the
; arms' reload cues, group.name, per variant); twin (taped) magazines: the pair's second bone and its rest in taped
; states A and B (B turned TapedRot degrees about Z); GrabTrigger=1: the magazine is grabbed only with the off hand's
; trigger held (else the grip takes the foregrip); TriggerRack=1: the gun hand's trigger also releases a locked-back
; action once a magazine is in. The .Ref lines are the RefSkeleton check.
; GOAL A1, the Garand's en-bloc clip: EjectOnEmpty=1 (the game throws the empty clip itself at the last shot, with its
; ping), Feed=insert (a clip pushed into the empty gun loads it and the op-rod closes on its own: no rack; SndClose plays
; then), NoGrab=1 (a seated clip can't be pulled out), Latch=1 (the release button -- the clip latch -- ejects a part-used
; clip, its rounds back to the reserve; 0 = it does nothing), KeepChambered=0|1 (per gun, over the key above), EjectSpeed
; (m/s an ejected magazine leaves the well; 0.4 when not given).
; GOAL A5, the Panzerschreck: Insert=slide -- a rocket from the pouch goes in nose first at the tube's rear mouth, then
; slides home as the off hand pushes it (MagLen = its length from the grab point, the tail, to the nose; MagSeat = how
; deep the seated tail sits inside the mouth); letting go part-way in, it slides home by itself.
; GOAL A2, the bolt actions (Action=bolt): the off hand takes the knob and works it -- up, back, forward, down. After
; a shot the trigger does nothing until the bolt is back down on a fresh round (the case leaves as the bolt comes back).
; With the bolt open, a stripper clip (from upgrade 1) or single rounds (below it) come from the pouch and go in at the
; open action. BoltTurn = the bolt bones turned BoltLift degrees about the bore at their own origin, BoltSlide = the bone
; that draws them back BoltTravel units, Knob = the handle's ball in the first turned bone, TopRoundAt = the top round
; seen in the open action, MagRest = where the clip / round sits seated (the game parks them), ClipIn = a stripped clip
; in the guides; the bolt's cues.
; 1 = an emptied bolt stays open (the magazine's follower) until a round is loaded; 0 = it closes empty.
HoldOpen=1
; GOAL A5, the M18 (Action=bolt with a swing): its breech is worked by the handle knob -- turned up (unlock), then the
; breech swung open about its hinge (BoltSwing / SwingAxis / SwingAt / SwingDeg), the spent case falling out; a round
; from the pouch slides in nose first (Insert=slide), then the breech is swung shut and the handle turned down (lock).
; HoldOpen=0: the breech closes empty too.
; GOAL A4, the C96 below its 20-round magazine (a line per range of upgrade levels: Key@N with MinUpgrade / MaxUpgrade):
; its fixed 10-round magazine is loaded from the top -- fired empty, the bolt stays back; a stripper clip from the pouch,
; seated in the guides over the open action (MagRest), strips its rounds into the magazine; a tug on the bolt and letting
; go closes it on them.
; GOAL A3, the M12 (Action=pump): after every shot the trigger does nothing until the pump has been worked -- back (the
; case out) and forward (a shell from the tube into the chamber); two-handed, the foregrip is the pump. Shells go one at
; a time from the pouch into the loading port under the receiver (while the tube has room), with the action closed; an
; emptied gun loaded again needs one pump. Bolt = the pump and the bolt seen in the port, moved along the pump's tilted
; axis; MagRest = the shell seated in the port (12 values: its turned frame, then the point); SndIn2 = the shell's second
; cue; SndBack / SndFwd = the pump's.
; The guns (attachment keys, comma-separated) that keep the game's own reload, e.g. Off=Attachment_M1Garand.
Off=
