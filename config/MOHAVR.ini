; MOHAVR -- shipped defaults. Deployed next to dinput8.dll in UnrealEngine3\Binaries.
; Every behaviour has a switch; on by default only once the simulator has proven it.

[General]
; 0 = act as a plain dinput8.dll proxy and do nothing else
Enabled=1

[Hooks]
; Observe Direct3DCreate9 through the game's import table (M1)
Direct3DCreate9=1

[Bridge]
; 1 = create the game's IDirect3D9 through Direct3DCreate9On12, so every D3D9 resource is a
; D3D12 resource (the zero-copy path to OpenXR, D5a). Headset-proven (rounds 1-4).
D3D9On12=1
; 1 = start MOHAVR-host.exe (64-bit, next to this file) and hand it each frame through shared
; D3D12 textures; the host runs OpenXR outside the game's 2 GB address space (D10).
; Needs D3D9On12=1. Uses OpenXR.RuntimeJson below.
Host=1
; Desktop mirror -- the game's own window stays white under D3D9On12, so the host can show what the
; headset gets (the centre of the left eye) on the monitor: 0 = off, 1 = over the game window
; (click-through, only while the game is in front), 2 = in its own "MOHAVR mirror" window.
Mirror=1

[Camera]
; 1 = the headset drives the game camera (M3): view = game heading + head orientation; the game's
; own pitch/roll are replaced by the head's. Needs Bridge.Host=1. Headset-proven (rounds 2-4).
HeadTracking=1
; 1 = also apply head translation (lean, crouch in place)
HeadPosition=1
; 1 = render with the headset's field of view (asymmetric projection)
HeadsetProjection=1
; 1 = stereo (M4): the engine draws two views side by side -- left half = left eye, right half =
; right eye -- through its own split-screen path, each with that eye's pose and FOV. Headset-proven (rounds 3-4).
Stereo=1
; 1 = give the right eye its own occlusion/visibility history (FSceneViewState). With one shared
; state the right eye used the left eye's occlusion results and flickered (headset round 3).
StereoViewState=1
; Unreal units per metre -- sets head movement AND, in stereo, the eye separation, i.e. the perceived
; world size (higher = smaller world). 100 per the player in the headset (round 4), which matches the
; 192-unit soldier (ENGINE-NOTES 5i). The in-headset menu overrides this per player (MOHAVR.user.ini).
UnitsPerMeter=100
; While head tracking: turn the game's motion blur / depth of field off in memory (head motion is
; camera motion, so they smear the image). Your MOHA settings file is not changed.
DisableMotionBlur=1
DisableDepthOfField=1
; Flat screen (M5): instead of splitting across the eyes, draw these full-screen and flat, without head
; tracking, on a world-locked screen in front of you:
;   0 = never, 1 = UI menus (main menu, pause, ...: detected by the Windows cursor being shown),
;   2 = UI menus + cinematic cameras (the view isn't the player's own: cutscenes, and also the game's
;       own camera animations such as the parachute landing roll).
; The screen: ScreenDistance / ScreenWidth in metres (also used whenever there's no view).
CinemaScreen=1
ScreenDistance=2.0
ScreenWidth=1.6

[Render]
; The game's resolution while the mod runs (windowed; 0 = the game's own setting). Each eye gets half the
; width: 2880x1620 -> 1440x1620 per eye (sharper; headset round 5), 1920x1080 -> 960x1080. 2880x1620
; measured 6.0 ms per frame with ~500 MB of address space left (ENGINE-NOTES 5p). Lower it on a slower PC.
; Your MOHA settings and Steam launch options are not changed.
ResX=2880
ResY=1620
; 1 = keep the game window at the size it renders. Otherwise Windows shrinks a window bigger than the desktop
; when you drag it, and the two eye images get mixed up (double vision; headset rounds 5-6). Moving is fine.
LockWindow=1
; 1 = decals (bullet holes, scorch marks) show in the right eye too. The engine culls every decal in a view
; that doesn't start at x = 0 (headset round 7; ENGINE-NOTES 5r).
DecalFix=1

[HUD]
; 0 = the HUD as the game draws it: in stereo, once per eye half, laid out for a half-width screen (it
;     lands in different places in each eye)
; 1 = one head-locked panel: Width metres wide, Distance metres ahead, Down metres below eye level; both
;     eyes see it in the same place (M5)
; Scale = the HUD's own size inside the panel (1 = its designed pixel size; smaller fits more in).
Mode=1
Distance=2.0
Width=2.4
Down=0.1
Scale=0.5

[Aim]
; 1 = your head's up/down angle is the player's aim pitch: the gun and the shots follow where you look
; vertically (left alone, stray mouse movement tilts the gun in front of your eyes).
HeadPitch=1
; What you aim with (needs Input.Controllers for 2/3):
;   0 = the game's own aim: the body's heading, and the head's pitch (HeadPitch)
;   1 = the head: shots land where you look (the centre of your view)
;   2 = the left controller, 3 = the right controller: shots land where it points
; Shots still start at the game's eye; the aim bends them so they land exactly where the head/controller
; ray hits. (Default 3: the player's choice, headset round 11.)
Mode=3
; Modes 2/3 with the gun in your hand (Weapon.ViewModel=2): cm the aim runs above the controller, along the gun's
; barrel (8: headset round 12, the pistol).
RayUp=8
; Modes 2/3: a red dot where the shot will land (ReticleSize in degrees).
Reticle=1
ReticleSize=0.8

[Weapon]
; 1 = hide the first-person gun (it sits a few cm from the eyes, so in stereo it's seen double). Uses the
; pawn's own HideWeapon command; survives weapon switches. The hands/arms stay.
HideViewModel=0
; 1 = also hide the first-person body/sleeves (the pawn's RenderBody command).
HideBody=0
; The first-person arms and gun:
;   0 = as the game draws them (a flat-screen trick: in the headset they look doubled)
;   1 = true 3D, where they really are (in front of your face)
;   2 = in your aiming hand (the controller Aim.Mode uses; the right one by default). Default: headset round 12.
ViewModel=2
; ViewModel=2: the point of the gun, in the game camera's frame (Unreal units: forward, right, up), that is
; put on the controller. Default: the gun's origin (measured 2026-09-27: 34 forward, 11 right, 17 down).
GripX=34
GripY=11
GripZ=-17

[Input]
; 1 = the headset's controllers play the game as an Xbox pad (M6): the host maps them to a virtual
; pad 0 and the mod answers the game's XInput polls with it. Needs Bridge.Host=1. A real pad in
; slot 0 is hidden while the host drives it. With this on, TAP the left menu button for the game's
; Start (pause) and HOLD it for the MOHAVR menu.
Controllers=1

[Controls]
; Which controller input(s) drive each Xbox control (Controllers=1); several are joined with commas.
; Inputs: a b x y lgrip rgrip ltrigger rtrigger lthumb rthumb menu rflickdown rflickup none
; (lthumb/rthumb = stick clicks, menu = a tap of the left menu button, rflickdown/rflickup = flicking
; the right stick down/up). What the game does with each Xbox control (MOHA's own pad layout):
;   A reload/use/flare/skip   B switch weapon   X crouch (toggles)   Y jump   LB alt fire
;   RB grenade   LT aim   RT fire   LS sprint   RS melee   Start pause   Back scores
; Defaults (headset round 5): A jump, B reload, right grip interact, Y switch weapon, X grenade,
; right stick flicked down crouch, left stick click sprint.
A=b,rgrip
B=y
X=rflickdown
Y=a
LB=lgrip
RB=x
LT=ltrigger
RT=rtrigger
LS=lthumb
RS=rthumb
Start=menu
Back=none
DPadUp=none
DPadDown=none
DPadLeft=none
DPadRight=none
; 1 = sprint is a toggle: click the stick to start sprinting, click again (or stop moving) to stop.
; 0 = hold the click to sprint (the game's own behaviour).
SprintToggle=1
; Which thumbstick is the Xbox left / right stick: left, right or none.
LeftStick=left
RightStick=right
; 1 = the right stick's up/down also pitches the game camera (off: the head drives pitch, and the
; right stick's down flick is crouch).
RightStickY=0
; How long to hold the left menu button to open the MOHAVR menu (seconds).
MenuHoldSeconds=0.6

[ControlsMenu]
; While one of the game's menus is open (title screen, pause, ...) the face buttons work as labelled, so A
; selects and B backs out. Everything not listed here works as in [Controls].
A=a
B=b
X=x
Y=y

[Comfort]
; Turning with the right stick (Input.Controllers=1): 0 = smooth, 30 or 45 = snap by that many
; degrees per flick. The in-headset menu (Turning) overrides this per player.
SnapTurn=0

[OpenXR]
; 1 = start an OpenXR session INSIDE the game (diagnostic; costs ~258 MB of the game's address
; space, ENGINE-NOTES 5e). Ignored when Bridge.Host=1.
Enabled=0
; Empty = the machine's active OpenXR runtime (the headset). A path to a runtime .json sets
; XR_RUNTIME_JSON for the process that runs OpenXR only. It must match THAT process's bitness:
;   Bridge.Host=1 (64-bit host):   C:\Users\j_tom\Projects\MOHAVR\tools\OpenXR-Simulator\bin\openxr_simulator.json
;   OpenXR.Enabled=1 (in-game x86): C:\Users\j_tom\Projects\MOHAVR\tools\OpenXR-Simulator-x86\bin\openxr_simulator.json
RuntimeJson=

[Debug]
; 1 = pretend the build check failed, to prove the mod stands down cleanly
TestWrongBuild=0
; 1 = write the game camera (position, yaw, pitch) to %TEMP%\MOHAVR\view_state.txt 5x a second (tests)
ViewState=0
; 1 = run console commands from %TEMP%\MOHAVR\game_cmd.txt (tools/game_cmd.py; tests only)
GameCommands=0
; 1 = draw the right eye first (experiments only)
SwapEyeOrder=0
; 1 = draw the left eye in the right half (experiments only)
SwapHalves=0
; 1 = log scissor rectangles and viewport changes with a stack scan (diagnostics; found the decal bug)
TraceScissor=0
